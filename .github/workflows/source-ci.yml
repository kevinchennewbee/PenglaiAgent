name: Source CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, "0.5.7", "0.5.9-preview"]

permissions:
  contents: read

concurrency:
  group: source-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Full source gates
    # The product ships only native macOS/Windows targets. Several source gates
    # execute the pinned Mnemon helper and target-bound plugin catalog, so run
    # the aggregate suite on a real supported host; the separate native release
    # workflow independently covers Intel macOS and Windows.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # Pull-request jobs otherwise test GitHub's synthetic merge commit,
          # which cannot serve as the immutable release candidate identity.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check out immutable official DSH alpha.2 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: deepseek-ai/DeepSeek-Harness
          ref: 0a53fb55bea101816fa226bb964ae2bed71c343b
          path: upstream-dsh
          fetch-depth: 1
      - name: Prepare authoritative main identity
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git rev-parse --verify refs/remotes/origin/main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
      - name: Install pinned dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm install --frozen-lockfile
      - name: Install independent Office verification tools
        run: brew install poppler
      - name: Verify 0.5.9 preview boundaries
        if: github.ref == 'refs/heads/0.5.9-preview' || github.head_ref == '0.5.9-preview'
        run: pnpm verify:059-preview
      - name: Verify fixed DSH npm cohort
        env:
          PENGLAI_DSH_UPSTREAM: ${{ github.workspace }}/upstream-dsh
        run: |
          pnpm verify:dsh-npm-cohort
          pnpm verify:dsh-npm-cohort:live
      - name: Fetch and verify the pinned native Mnemon binary
        run: pnpm fetch:mnemon-assets
      - name: Source, contract, and evidence-class gates
        env:
          PENGLAI_DSH_ALPHA_SOURCE: ${{ github.workspace }}/upstream-dsh
        run: |
          pnpm format:check
          pnpm typecheck
          pnpm test:unit
          pnpm test:contract
          pnpm test:integration
          pnpm test:e2e
          pnpm test:security
          pnpm test:chaos
          pnpm test:failure-baseline
          pnpm audit:secrets
          pnpm audit:supply-chain
          pnpm verify:versions
          pnpm verify:identity
          pnpm verify:contracts
          pnpm verify:dependencies
          pnpm verify:059-manifests
          pnpm verify:dsh-alpha-owner-remotes
          pnpm build
          pnpm pack:plugins
          pnpm verify:office-real
          pnpm verify:memory-real
          pnpm verify:asr-real
          pnpm verify:moss-real
          pnpm verify:clean-clone
