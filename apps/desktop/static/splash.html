<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <meta name="color-scheme" content="light dark" />
    <title>蓬莱正在启动</title>
    <style>
      :root {
        font-family: "Avenir Next", "Segoe UI", "PingFang SC", "Microsoft YaHei UI", sans-serif;
        color: #2c333a;
        background: #f6f1e8;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(ellipse at 50% 28%, rgba(196, 92, 38, 0.14), transparent 34%),
          linear-gradient(165deg, #f6f1e8, #efe8db);
      }
      main {
        width: min(440px, calc(100vw - 48px));
        padding: 46px 42px 40px;
        text-align: center;
        border: 1px solid rgba(201, 163, 106, 0.45);
        border-top: 2px solid #c9a36a;
        background: rgba(255, 249, 240, 0.88);
        box-shadow: 0 24px 70px rgba(11, 28, 44, 0.12);
      }
      .mark {
        width: 68px;
        height: 68px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border-radius: 6px;
        color: #f6f1e8;
        background: #c45c26;
        border: 1px solid #c9a36a;
        font: 700 29px/1 Georgia, "Songti SC", "Microsoft YaHei UI", serif;
      }
      h1 {
        margin: 0;
        font-family: Georgia, "Songti SC", serif;
        font-size: 30px;
        letter-spacing: 0.12em;
        font-weight: 600;
      }
      .lead { margin: 16px 0 5px; font-size: 17px; font-weight: 600; }
      .lead-en { margin: 0; color: #3e474f; font-size: 13px; }
      .progress {
        height: 3px;
        margin: 30px 0 18px;
        overflow: hidden;
        background: rgba(11, 28, 44, 0.12);
      }
      .progress::after {
        content: "";
        display: block;
        width: 42%;
        height: 100%;
        background: linear-gradient(90deg, #c45c26, #c9a36a);
        animation: loading 1.6s ease-in-out infinite alternate;
      }
      .note { margin: 0; color: #3e474f; font-size: 13px; }
      @keyframes loading {
        from { transform: translateX(-12%); }
        to { transform: translateX(150%); }
      }
      @media (prefers-color-scheme: dark) {
        :root { color: #f6f1e8; background: #0b1c2c; }
        body {
          background:
            radial-gradient(ellipse at 50% 30%, rgba(196, 92, 38, 0.22), transparent 40%),
            #0b1c2c;
        }
        main {
          background: rgba(18, 36, 51, 0.92);
          border-color: rgba(201, 163, 106, 0.35);
        }
        .lead-en, .note { color: #c9c2b6; }
        .progress { background: rgba(246, 241, 232, 0.12); }
      }
      @media (prefers-reduced-motion: reduce) {
        .progress::after {
          animation: none;
          width: 42%;
          transform: none;
        }
      }
    </style>
  </head>
  <body data-penglai-splash="1">
    <main>
      <div class="mark" aria-hidden="true">蓬</div>
      <h1>蓬莱</h1>
      <p class="lead" data-penglai-splash-zh="1">正在准备你的个人 AI 助手</p>
      <p class="lead-en" data-penglai-splash-en="1" lang="en">Getting your personal AI assistant ready</p>
      <div class="progress" role="progressbar" aria-label="蓬莱正在启动"></div>
      <p class="note">首次启动可能需要几秒，之后会更快</p>
      <div data-penglai-splash-phases="1" hidden aria-hidden="true">
        <span data-phase="boot"></span>
        <span data-phase="checking-private-data"></span>
        <span data-phase="verifying-runtime"></span>
        <span data-phase="starting-dsh"></span>
        <span data-phase="waiting-http"></span>
        <span data-phase="verifying-required-plugins"></span>
        <span data-phase="ready"></span>
      </div>
    </main>
  </body>
</html>
