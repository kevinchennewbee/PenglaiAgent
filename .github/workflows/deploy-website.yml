name: Deploy website

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable Release tag that must already exist (example v0.5.7)
        required: true
        type: string

permissions:
  contents: write

jobs:
  deploy:
    name: Readback then deploy gh-pages
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
      - name: Require the requested tag
        run: |
          test "${{ inputs.tag }}" = "v0.5.7"
      - name: Public readback
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          pnpm install --frozen-lockfile
          pnpm readback:release v0.5.7
      - name: This workflow must not run from Grok Build
        run: echo "Manual production deploy only after Codex merge and public readback."
