# penglai_providers.yaml — 蓬莱 LLM 提供商目录
# 来源：各官方文档实时抓取 2026-06-11；2026-06-12 按用户实测报告 v2 全面修正
# 2026-06-29 核实修正：hunyuan 旧版全下线→hy3-preview；openrouter slug 点号；moonshot→k2.7-code；bailian→qwen3.6-flash
# 2026-07-28 0.4 收口：补 OpenAI / xAI Grok 官方 OpenAI 兼容端点；wizard 顺序把常用按量厂牌前置；
#   Coding Plan / Agent Plan 仅作透明展示（专属端点+条款限制），管家主力请用 paygo OpenAI 兼容 base_url。
# 2026-07-29 目录刷新（公开文档/TinyFish 交叉核实）：
#   - DeepSeek: chat/reasoner 已于 2026-07-24 退役 → 仅 V4 Flash/Pro
#   - 智谱: 默认升 glm-5.2；Coding Plan 列表同步 5.2
#   - Moonshot: 增 kimi-k3 为默认；K2.7 Code 保留
#   - xAI: 默认 grok-4.5（官方 OpenAI 兼容 api.x.ai）；网页登录/SuperGrok 反代不作为一等接入
#   - OpenRouter: sonnet-5 / grok-4.5 / kimi-k3 等 slug 更新
# 2026-07-29 晚再校（用户反馈默认模型过时 + 下线低频厂牌）：
#   - 混元：默认 hy3 正式版；hy3-preview 2026-08-31 下线
#   - 火山：默认 doubao-seed-evolving（周迭代）；2.1/2.0 保留
#   - 百炼：补 qwen3.7-flash；默认仍 qwen3.7-plus（官方按量主推）
#   - 下线目录维护：百川 / 讯飞星火 / Agnes（不再一等接入；可用自定义端点）
# （套餐与按量的 base_url/Key/默认模型三件套互不通用；Anthropic 与 OpenAI 协议端点不同不可混用）
# 用途：setup 向导、Web 初始化、客户端 — 所有入口读此文件，此处更新即全局生效
# 新鲜度机制：L1 本 yaml 种子 → L2 向导 GET /models 实时 → L3 penglai catalog refresh 覆盖层
#
# 价格单位：元/百万 tokens（人民币），input = 缓存未命中价（国际厂牌可另标 input_usd）
# context_k：上下文窗口（千 tokens）
# default: true → 向导默认高亮该模型
# base_url = OpenAI 兼容端点（蓬莱实际调用的）；base_url_anthropic = Anthropic 协议端点（备查）

updated: '2026-07-29'
currency: CNY
wizard_order: [deepseek, volcengine, bailian, zhipu, minimax, moonshot, openai, xai, openrouter, hunyuan, custom]
providers:
  deepseek:
    display: DeepSeek
    signup_url: "https://platform.deepseek.com"
    billing:
      paygo:
        label: 按量付费
        base_url: "https://api.deepseek.com"
        base_url_anthropic: "https://api.deepseek.com/anthropic"
        note: 充值余额即用，无月租
        models:
        - id: deepseek-v4-flash
          display: "V4 Flash（通用，推荐）"
          context_k: 1000
          max_output_k: 384
          input_cny: 1.0
          input_cached_cny: 0.02
          output_cny: 2.0
          features: [thinking, tools, json_mode]
          default: true
        - id: deepseek-v4-pro
          display: "V4 Pro（强推理）"
          context_k: 1000
          max_output_k: 384
          input_cny: 3.0
          input_cached_cny: 0.025
          output_cny: 6.0
          features: [thinking, tools, json_mode]
    default_billing: paygo
    default_model: deepseek-v4-flash
    deprecated:
    - {id: deepseek-chat, replace: deepseek-v4-flash, deadline: '2026-07-24'}
    - {id: deepseek-reasoner, replace: deepseek-v4-flash, deadline: '2026-07-24'}
