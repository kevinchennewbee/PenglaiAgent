name: Native 0.5.10 release candidate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build native clients first; verify the live catalog only after its release exists
        required: true
        default: native
        type: choice
        options:
          - native
          - catalog

permissions:
  contents: read

concurrency:
  group: native-0.5.10-${{ inputs.mode }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm-cohort:
    name: Verify fixed DSH npm cohort
    if: ${{ inputs.mode == 'native' }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check out immutable official DSH rc.1 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: deepseek-ai/DeepSeek-Harness
          ref: a66e4702047846cdaa10c66c9d3df3951f5ea70d
          path: upstream-dsh
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
      - name: Install pinned dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm install --frozen-lockfile
      - name: Verify the immutable rc.1 registry cohort
        env:
          PENGLAI_DSH_UPSTREAM: ${{ github.workspace }}/upstream-dsh
        run: |
          pnpm verify:dsh-npm-cohort
          pnpm verify:dsh-npm-cohort:live
          pnpm verify:release-adaptation

  plugin-distribution:
    name: Signed Plugin Center distribution
    if: ${{ inputs.mode == 'catalog' }}
    # The boot-time revocation path deliberately derives the product plugin
    # target from the native host. Linux is not a Penglai release target.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
      - name: Install pinned dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm install --frozen-lockfile
      - name: Build source dependencies for the distribution verifier
        run: pnpm build
      - name: Verify immutable catalog, disabled install, and offline recovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm verify:live-plugin-catalog

  macos:
    name: macOS ${{ matrix.target }}
    if: ${{ inputs.mode == 'native' }}
    needs: npm-cohort
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-aarch64
            package: package:dmg:arm
            installer: Penglai_0.5.10_macos_aarch64.dmg
            previous: Penglai_0.5.8_macos_aarch64.dmg
          - runner: macos-15-intel
            target: darwin-x86_64
            package: package:dmg:intel
            installer: Penglai_0.5.10_macos_x64.dmg
            previous: Penglai_0.5.8_macos_x64.dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
      - name: Prepare clean main
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$GITHUB_SHA" = "$(git rev-parse refs/remotes/origin/main)"
          git switch -C main "$GITHUB_SHA"
      - name: Install pinned dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm install --frozen-lockfile
      - name: Verify clean public export
        run: pnpm prepare:public-export -- --clean-room
      - name: Build source from the clean checkout
        run: pnpm build
      - name: Audit target-specific supply chain
        env:
          PENGLAI_TARGET: ${{ matrix.target }}
        run: |
          pnpm audit:supply-chain
          cp evidence/generated/licenses.json evidence/generated/licenses-${{ matrix.target }}.json
          cp evidence/generated/sbom.json evidence/generated/sbom-${{ matrix.target }}.json
          cp evidence/generated/THIRD_PARTY_NOTICES.txt evidence/generated/THIRD_PARTY_NOTICES-${{ matrix.target }}.txt
      - name: Source and onboarding regression gates
        shell: bash
        run: |
          pnpm test:unit
          pnpm test:contract
          pnpm test:security
          pnpm verify:contracts
      - name: Fetch and verify the pinned native Mnemon binary
        run: pnpm fetch:mnemon-assets
      - name: Build exact native installer
        run: pnpm ${{ matrix.package }}
      - name: Verify native closure, artifact, fuses, and signing contract
        env:
          PENGLAI_TARGET: ${{ matrix.target }}
        run: |
          pnpm verify:closure
          pnpm verify:artifact
          pnpm verify:fuses
          pnpm verify:signing
      - name: Verify full first-party profile matrix
        env:
          PENGLAI_TARGET: ${{ matrix.target }}
        run: pnpm verify:profile:voice-matrix
      - name: Full installed product and onboarding suite
        env:
          PENGLAI_TARGET: ${{ matrix.target }}
          PENGLAI_INSTALLED_UI_HARNESS: ${{ github.workspace }}/node_modules/electron/dist/Electron.app/Contents/MacOS/Electron
        run: pnpm test:e2e:installed
      - name: Installed welcome and process smoke
        env:
          PENGLAI_TARGET: ${{ matrix.target }}
          PENGLAI_INSTALLED_UI_HARNESS: ${{ github.workspace }}/node_modules/electron/dist/Electron.app/Contents/MacOS/Electron
        run: pnpm test:u3:welcome
      - name: Installed first-party plugin compatibility
        env:
          PENGLAI_TARGET: ${{ matrix.target }}
          PENGLAI_INSTALLED_UI_HARNESS: ${{ github.workspace }}/node_modules/electron/dist/Electron.app/Contents/MacOS/Electron
        run: pnpm test:u3:plugins
      - name: Verify bound installed evidence bundle
        env:
          PENGLAI_TARGET: ${{ matrix.target }}
        run: pnpm verify:installed
      - name: Download verified immutable 0.5.8 and 0.5.9 upgrade sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/fetch-upgrade-sources.mjs --target "${{ matrix.target }}"
      - name: Prove both native upgrade paths and default uninstall
        env:
          PENGLAI_TARGET: ${{ matrix.target }}
          PENGLAI_LIFECYCLE_ALLOW_NATIVE: "1"
        run: pnpm verify:upgrade-uninstall
      - name: Upload installer and target evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: penglai-0.5.10-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/${{ matrix.installer }}
            evidence/generated/local-installer-${{ matrix.target }}.json
            evidence/generated/verify-closure-${{ matrix.target }}.json
            evidence/generated/verify-artifact-${{ matrix.target }}.json
            evidence/generated/verify-fuses-${{ matrix.target }}.json
            evidence/generated/verify-signing-${{ matrix.target }}.json
            evidence/generated/verify-profile-${{ matrix.target }}.json
            evidence/generated/installed-e2e-${{ matrix.target }}.json
            evidence/generated/verify-installed-${{ matrix.target }}.json
            evidence/generated/verify-upgrade-uninstall-${{ matrix.target }}.json
            evidence/generated/u3-welcome-smoke.json
            evidence/generated/u3-first-party-plugins.json
            evidence/generated/u3-welcome-smoke-${{ matrix.target }}.json
            evidence/generated/u3-first-party-plugins-${{ matrix.target }}.json
            evidence/generated/public-export.json
            evidence/generated/licenses-${{ matrix.target }}.json
            evidence/generated/sbom-${{ matrix.target }}.json
            evidence/generated/THIRD_PARTY_NOTICES-${{ matrix.target }}.txt

  windows:
    name: Windows win32-x86_64
    if: ${{ inputs.mode == 'native' }}
    needs: npm-cohort
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
      - name: Prepare clean main
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$GITHUB_SHA" = "$(git rev-parse refs/remotes/origin/main)"
          git switch -C main "$GITHUB_SHA"
      - name: Install pinned dependencies
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm install --frozen-lockfile
      - name: Verify clean public export
        run: pnpm prepare:public-export -- --clean-room
      - name: Build source from the clean checkout
        run: pnpm build
      - name: Audit target-specific supply chain
        shell: pwsh
        env:
          PENGLAI_TARGET: win32-x86_64
        run: |
          pnpm audit:supply-chain
          Copy-Item evidence/generated/licenses.json evidence/generated/licenses-win32-x86_64.json
          Copy-Item evidence/generated/sbom.json evidence/generated/sbom-win32-x86_64.json
          Copy-Item evidence/generated/THIRD_PARTY_NOTICES.txt evidence/generated/THIRD_PARTY_NOTICES-win32-x86_64.txt
      - name: Install integrity-pinned NSIS 3.12
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'nsis-3.12.zip'
          $root = Join-Path $env:RUNNER_TEMP 'nsis-3.12'
          $expected = '56581f90db321581c5381193d796fffcf2d24b2f8fed2160a6c6a3baa67f2c4f'
          $expectedSize = 2362938
          $urls = @(
            'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.12/nsis-3.12.zip',
            'https://mirrors.mit.edu/macports/distfiles/nsis/nsis-3.12.zip'
          )
          $verified = $false
          foreach ($url in $urls) {
            Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
            curl.exe --fail --location --retry 3 --retry-all-errors --max-time 120 --silent --show-error --output $archive $url
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $archive)) { continue }
            $actualSize = (Get-Item -LiteralPath $archive).Length
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
            if ($actualSize -eq $expectedSize -and $actual -eq $expected) {
              $verified = $true
              break
            }
          }
          if (-not $verified) { throw "NSIS archive size and digest verification failed for every pinned source" }
          Expand-Archive -LiteralPath $archive -DestinationPath $root
          $compiler = Get-ChildItem -LiteralPath $root -Filter makensis.exe -Recurse -File | Select-Object -First 1
          if (-not $compiler) { throw "Pinned NSIS compiler missing" }
          $compiler.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build native Windows security helper for regression gates
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          pnpm build:windows-host
      - name: Source and onboarding regression gates
        shell: bash
        run: |
          pnpm test:unit
          pnpm test:contract
          pnpm test:security
          pnpm verify:contracts
      - name: Fetch and verify the pinned native Mnemon binary
        run: pnpm fetch:mnemon-assets
      - name: Build exact native installer with MSVC
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          pnpm package:windows
      - name: Verify native closure, artifact, fuses, and signing contract
        env:
          PENGLAI_TARGET: win32-x86_64
        run: |
          pnpm verify:closure
          pnpm verify:artifact
          pnpm verify:fuses
          pnpm verify:signing
      - name: Verify full first-party profile matrix
        env:
          PENGLAI_TARGET: win32-x86_64
        run: pnpm verify:profile:voice-matrix
      - name: Prove Simplified Chinese installer UI on the native host
        shell: pwsh
        run: >-
          ./scripts/windows-installer-ui-proof.ps1
          -Installer ./dist/Penglai_0.5.10_windows_x64_setup.exe
          -OutDir ./evidence/generated
      - name: Full installed product and onboarding suite
        shell: pwsh
        env:
          PENGLAI_TARGET: win32-x86_64
          PENGLAI_INSTALLED_UI_HARNESS: ${{ github.workspace }}\node_modules\electron\dist\electron.exe
        run: pnpm test:e2e:installed
      - name: Installed welcome and process smoke
        shell: pwsh
        env:
          PENGLAI_TARGET: win32-x86_64
          PENGLAI_INSTALLED_UI_HARNESS: ${{ github.workspace }}\node_modules\electron\dist\electron.exe
        run: pnpm test:u3:welcome
      - name: Installed first-party plugin compatibility
        shell: pwsh
        env:
          PENGLAI_TARGET: win32-x86_64
          PENGLAI_INSTALLED_UI_HARNESS: ${{ github.workspace }}\node_modules\electron\dist\electron.exe
        run: pnpm test:u3:plugins
      - name: Verify bound installed evidence bundle
        shell: pwsh
        env:
          PENGLAI_TARGET: win32-x86_64
        run: pnpm verify:installed
      - name: Download verified immutable 0.5.8 and 0.5.9 upgrade sources
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/fetch-upgrade-sources.mjs --target win32-x86_64
      - name: Prove both native upgrade paths and default uninstall
        shell: pwsh
        env:
          PENGLAI_TARGET: win32-x86_64
          PENGLAI_LIFECYCLE_ALLOW_NATIVE: "1"
        run: pnpm verify:upgrade-uninstall
      - name: Upload installer and target evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: penglai-0.5.10-win32-x86_64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/Penglai_0.5.10_windows_x64_setup.exe
            evidence/generated/local-installer-win32-x86_64.json
            evidence/generated/verify-closure-win32-x86_64.json
            evidence/generated/verify-artifact-win32-x86_64.json
            evidence/generated/verify-fuses-win32-x86_64.json
            evidence/generated/verify-signing-win32-x86_64.json
            evidence/generated/verify-profile-win32-x86_64.json
            evidence/generated/installed-e2e-win32-x86_64.json
            evidence/generated/verify-installed-win32-x86_64.json
            evidence/generated/verify-upgrade-uninstall-win32-x86_64.json
            evidence/generated/u3-welcome-smoke.json
            evidence/generated/u3-first-party-plugins.json
            evidence/generated/u3-welcome-smoke-win32-x86_64.json
            evidence/generated/u3-first-party-plugins-win32-x86_64.json
            evidence/generated/windows-installer-ui.json
            evidence/generated/windows-installer-components-zh.png
            evidence/generated/public-export.json
            evidence/generated/licenses-win32-x86_64.json
            evidence/generated/sbom-win32-x86_64.json
            evidence/generated/THIRD_PARTY_NOTICES-win32-x86_64.txt

  aggregate:
    name: Exact three-target evidence aggregate
    if: ${{ inputs.mode == 'native' }}
    needs: [macos, windows]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
      - name: Require exact origin main
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$GITHUB_SHA" = "$(git rev-parse refs/remotes/origin/main)"
          git switch -C main "$GITHUB_SHA"
      - name: Install pinned dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm install --frozen-lockfile
          pnpm build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: penglai-0.5.10-darwin-aarch64
          path: .native/darwin-aarch64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: penglai-0.5.10-darwin-x86_64
          path: .native/darwin-x86_64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: penglai-0.5.10-win32-x86_64
          path: .native/win32-x86_64
      - name: Collect only target-bound evidence
        shell: bash
        run: |
          mkdir -p evidence/generated
          find .native -type f \( -name '*-darwin-aarch64.json' -o -name '*-darwin-x86_64.json' -o -name '*-win32-x86_64.json' \) -exec cp {} evidence/generated/ \;
      - name: Verify complete native evidence set
        run: |
          pnpm verify:native-set -- --command verify:closure
          pnpm verify:native-set -- --command verify:artifact
          pnpm verify:native-set -- --command verify:fuses
          pnpm verify:native-set -- --command verify:signing
          pnpm verify:native-set -- --command verify:profile
          pnpm verify:installed -- --aggregate
          pnpm verify:native-set -- --command verify:upgrade-uninstall
          pnpm aggregate:supply-chain
      - name: Verify source export and complete release aggregate
        run: |
          pnpm fetch:mnemon-assets
          pnpm prepare:public-export -- --clean-room
          pnpm verify:release
      - name: Upload consolidated native evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: penglai-0.5.10-native-evidence-set
          if-no-files-found: error
          retention-days: 14
          path: |
            evidence/generated/*.json
            evidence/generated/THIRD_PARTY_NOTICES.txt
