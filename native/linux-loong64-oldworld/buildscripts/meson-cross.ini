[host_machine]
system = 'linux'
cpu_family = 'loongarch64'
cpu = 'loongarch64'
endian = 'little'

[binaries]
c = '/private/tmp/penglai-uos20-addons-060/work/oldworld-cc'
cpp = '/private/tmp/penglai-uos20-addons-060/work/oldworld-c++'
ar = '/private/tmp/penglai-uos20-addons-060/work/oldworld-ar'
strip = '/usr/bin/true'
pkg-config = '/private/tmp/penglai-uos20-addons-060/work/oldworld-pkg-config'
pkgconfig = '/private/tmp/penglai-uos20-addons-060/work/oldworld-pkg-config'
glib-mkenums = '/private/tmp/penglai-uos20-addons-060/work/vips-deps/glib/_build/gobject/glib-mkenums'

[properties]
have_c99_vsnprintf = true
have_c99_snprintf = true
have_unix98_printf = true
sizeof_long = 8
sizeof_size_t = 8
sizeof_void_p = 8
skip_sanity_check = true
needs_exe_wrapper = true

[built-in options]
libdir = 'lib'
wrap_mode = 'nofallback'
default_library = 'static'
buildtype = 'release'
