name: host-publish

# Publishing is deliberately separate from the signed-tag build. The normal
# path publishes a verified draft and advances the updater channel. The
# recovery path repairs only a lagging metadata channel from an already-public,
# independently verified immutable release; it never rebuilds or replaces a
# versioned asset.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Publish a draft, or recover only the updater channel"
        required: true
        default: publish
        type: choice
        options:
          - publish
          - channel-recovery
      tag:
        description: "Exact signed stable tag to publish (for example v0.4.0)"
        required: true
        type: string
      confirm:
        description: "Enter publish-<tag> or recover-channel-<tag> exactly"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-v0.4-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Re-verify release and publish or recover desktop-v0.4
    if: github.repository == 'kevinchennewbee/PenglaiAgent'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLISH_TAG: ${{ inputs.tag }}
      PUBLISH_CONFIRM: ${{ inputs.confirm }}
      PUBLISH_OPERATION: ${{ inputs.operation }}
      TRUSTED_RELEASE_FINGERPRINT: 108B8D1D5592D8F71EEAC9AB362CF5452371B1E5
    steps:
      - name: Require exact Owner confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PUBLISH_TAG" =~ ^v0\.4\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::tag must be a strict stable v0.4.x tag"
            exit 1
          fi
          case "$PUBLISH_OPERATION" in
            publish) expected_confirm="publish-$PUBLISH_TAG" ;;
            channel-recovery) expected_confirm="recover-channel-$PUBLISH_TAG" ;;
            *) echo "::error::unsupported operation: $PUBLISH_OPERATION"; exit 1 ;;
          esac
          if [[ "$PUBLISH_CONFIRM" != "$expected_confirm" ]]; then
            echo "::error::confirmation must equal $expected_confirm"
            exit 1
          fi

      - name: Checkout exact release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.2"

      - name: Verify release contract and trusted signed annotated tag
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-release-contract.mjs \
            --tag "$PUBLISH_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --github-output "$GITHUB_OUTPUT"
          export GNUPGHOME="$RUNNER_TEMP/penglai-publish-gpg"
          install -d -m 0700 "$GNUPGHOME"
          mapfile -t primary_fingerprints < <(
            gpg --batch --with-colons --import-options show-only \
              --import packaging/penglai-release-signing-key.asc \
              | awk -F: '$1 == "pub" { want_primary = 1; next } $1 == "fpr" && want_primary { print $10; want_primary = 0 }'
          )
          if [[ "${#primary_fingerprints[@]}" -ne 1 || "${primary_fingerprints[0]}" != "$TRUSTED_RELEASE_FINGERPRINT" ]]; then
            echo "::error::repository release key is not the one trusted Owner primary key"
            exit 1
          fi
          gpg --batch --import packaging/penglai-release-signing-key.asc
          if [[ "$(git cat-file -t "refs/tags/$PUBLISH_TAG")" != "tag" ]]; then
            echo "::error::$PUBLISH_TAG must be an annotated tag object"
            exit 1
          fi
          verify_output="$(git verify-tag --raw "$PUBLISH_TAG" 2>&1)" || {
            printf '%s\n' "$verify_output"
            exit 1
          }
          printf '%s\n' "$verify_output"
          mapfile -t valid_signatures < <(
            printf '%s\n' "$verify_output" | sed -n 's/^\[GNUPG:\] VALIDSIG //p'
          )
          if [[ "${#valid_signatures[@]}" -ne 1 ]]; then
            echo "::error::tag must have exactly one valid Owner signature"
            exit 1
          fi
          signing_fingerprint="$(awk '{ print $1 }' <<<"${valid_signatures[0]}")"
          primary_fingerprint="$(awk '{ print $10 }' <<<"${valid_signatures[0]}")"
          if [[ "$signing_fingerprint" != "$TRUSTED_RELEASE_FINGERPRINT" && "$primary_fingerprint" != "$TRUSTED_RELEASE_FINGERPRINT" ]]; then
            echo "::error::valid tag signature is not rooted in the trusted Owner key"
            exit 1
          fi
          tag_target="$(git rev-parse "$PUBLISH_TAG^{commit}")"
          checkout_target="$(git rev-parse HEAD)"
          if [[ "$tag_target" != "$checkout_target" ]]; then
            echo "::error::checked-out commit is not the signed tag target"
            exit 1
          fi
          echo "tag_target=$tag_target" >> "$GITHUB_OUTPUT"

      - name: Require the exact release state for this operation
        shell: bash
        run: |
          set -euo pipefail
          release_state="$(gh release view "$PUBLISH_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease \
            --jq '[.tagName,.isDraft,.isPrerelease] | @tsv')"
          if [[ "$PUBLISH_OPERATION" == "publish" ]]; then
            expected_state="$(printf '%s\ttrue\tfalse' "$PUBLISH_TAG")"
          else
            expected_state="$(printf '%s\tfalse\tfalse' "$PUBLISH_TAG")"
          fi
          if [[ "$release_state" != "$expected_state" ]]; then
            echo "::error::$PUBLISH_TAG has the wrong state for $PUBLISH_OPERATION"
            exit 1
          fi

      - name: Download and cryptographically re-verify every release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-download
          gh release download "$PUBLISH_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-download
          node packages/desktop/updater/verify-release-assets.mjs \
            --dir release-download \
            --version "${PUBLISH_TAG#v}"

      - name: Reject updater channel rollback or conflicting replay
        id: channel_guard
        shell: bash
        env:
          PENGLAI_CHANNEL: ${{ steps.contract.outputs.channel }}
        run: |
          set -euo pipefail
          if gh release view "$PENGLAI_CHANNEL" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            channel_state="$(gh release view "$PENGLAI_CHANNEL" \
              --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease \
              --jq '[.isDraft,.isPrerelease] | @tsv')"
            if [[ "$channel_state" != $'false\ttrue' ]]; then
              echo "::error::$PENGLAI_CHANNEL must be a published prerelease metadata channel"
              exit 1
            fi
            existing_assets="$(gh release view "$PENGLAI_CHANNEL" \
              --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '[.assets[].name] | sort | join("\n")')"
            if [[ "$existing_assets" != "latest.json" ]]; then
              echo "::error::$PENGLAI_CHANNEL must contain exactly latest.json"
              exit 1
            fi
            mkdir existing-channel
            gh release download "$PENGLAI_CHANNEL" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern latest.json \
              --dir existing-channel
            CURRENT_MANIFEST="$GITHUB_WORKSPACE/existing-channel/latest.json" \
            CANDIDATE_MANIFEST="$GITHUB_WORKSPACE/release-download/latest.json" \
              node --input-type=module <<'NODE'
          import fs from "node:fs";
          const current = JSON.parse(fs.readFileSync(process.env.CURRENT_MANIFEST, "utf8"));
          const candidate = JSON.parse(fs.readFileSync(process.env.CANDIDATE_MANIFEST, "utf8"));
          const patch = (value) => {
            const match = /^0\.4\.(0|[1-9]\d*)$/.exec(value ?? "");
            if (!match) throw new Error(`invalid stable channel version: ${value}`);
            return Number(match[1]);
          };
          const currentPatch = patch(current.version);
          const candidatePatch = patch(candidate.version);
          if (candidatePatch < currentPatch) {
            throw new Error(`refusing updater rollback ${current.version} -> ${candidate.version}`);
          }
          if (candidatePatch === currentPatch) {
            const currentBytes = fs.readFileSync(process.env.CURRENT_MANIFEST);
            const candidateBytes = fs.readFileSync(process.env.CANDIDATE_MANIFEST);
            if (!currentBytes.equals(candidateBytes)) {
              throw new Error(`refusing conflicting updater replay for ${candidate.version}`);
            }
            console.log(`updater channel already has the exact ${candidate.version} manifest`);
          }
          NODE
          fi

      - name: Publish the independently verified immutable version release
        if: inputs.operation == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$PUBLISH_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
          published_state="$(gh release view "$PUBLISH_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease \
            --jq '[.tagName,.isDraft,.isPrerelease] | @tsv')"
          expected_state="$(printf '%s\tfalse\tfalse' "$PUBLISH_TAG")"
          if [[ "$published_state" != "$expected_state" ]]; then
            echo "::error::version release did not become the expected published stable release"
            exit 1
          fi

      - name: Advance the dedicated desktop-v0.4 metadata channel
        shell: bash
        env:
          PENGLAI_CHANNEL: ${{ steps.contract.outputs.channel }}
          TAG_TARGET: ${{ steps.contract.outputs.tag_target }}
        run: |
          set -euo pipefail
          mkdir new-channel-download
          new_channel=false
          if ! gh release view "$PENGLAI_CHANNEL" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            new_channel=true
            gh release create "$PENGLAI_CHANNEL" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TAG_TARGET" \
              --draft \
              --latest=false \
              --title "Penglai Desktop v0.4 stable update channel" \
              --notes "Metadata-only channel. Installers remain on immutable signed v0.4.x releases."
          fi
          gh release upload "$PENGLAI_CHANNEL" release-download/latest.json \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release download "$PENGLAI_CHANNEL" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json \
            --dir new-channel-download
          cmp release-download/latest.json new-channel-download/latest.json
          channel_assets="$(gh release view "$PENGLAI_CHANNEL" \
            --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '[.assets[].name] | sort | join("\n")')"
          if [[ "$channel_assets" != "latest.json" ]]; then
            echo "::error::$PENGLAI_CHANNEL must contain exactly latest.json"
            exit 1
          fi
          if [[ "$new_channel" == "true" ]]; then
            gh release edit "$PENGLAI_CHANNEL" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false \
              --prerelease \
              --latest=false
          fi
