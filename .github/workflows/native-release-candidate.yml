name: Native 0.5.5 release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-0.5.5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plugin-distribution:
    name: Signed Plugin Center distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
      - name: Install pinned dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          pnpm install --frozen-lockfile
      - name: Build source dependencies for the distribution verifier
        run: pnpm build
      - name: Verify immutable catalog, disabled install, and offline recovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm verify:live-plugin-catalog

  macos:
    name: macOS ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-aarch64
            package: package:dmg:arm
            installer: Penglai_0.5.5_macos_aarch64.dmg
          - runner: macos-15-intel
            target: darwin-x86_64
            package: package:dmg:intel
            installer: Penglai_0.5.5_macos_x64.dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
      - name: Prepare clean main
        run: git switch -C main "$GITHUB_SHA"
      - name: Install pinned dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          pnpm install --frozen-lockfile
      - name: Verify clean public export
        run: pnpm prepare:public-export -- --clean-room
      - name: Build source from the clean checkout
        run: pnpm build
      - name: Source and onboarding regression gates
        run: |
          pnpm test:unit
          pnpm test:contract
          pnpm test:security
          pnpm verify:contracts
      - name: Build exact native installer
        run: pnpm ${{ matrix.package }}
      - name: Verify packaged Electron fuses
        env:
          PENGLAI_TARGET: ${{ matrix.target }}
        run: pnpm verify:fuses
      - name: Installed welcome and process smoke
        env:
          PENGLAI_TARGET: ${{ matrix.target }}
          PENGLAI_INSTALLED_UI_HARNESS: ${{ github.workspace }}/node_modules/.pnpm/electron@43.4.0/node_modules/electron/dist/Electron.app/Contents/MacOS/Electron
        run: pnpm test:u3:welcome
      - name: Installed first-party plugin compatibility
        env:
          PENGLAI_TARGET: ${{ matrix.target }}
          PENGLAI_INSTALLED_UI_HARNESS: ${{ github.workspace }}/node_modules/.pnpm/electron@43.4.0/node_modules/electron/dist/Electron.app/Contents/MacOS/Electron
        run: pnpm test:u3:plugins
      - name: Upload installer and target evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: penglai-0.5.5-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/${{ matrix.installer }}
            evidence/generated/local-installer-${{ matrix.target }}.json
            evidence/generated/u3-welcome-smoke.json
            evidence/generated/u3-first-party-plugins.json
            evidence/generated/public-export.json

  windows:
    name: Windows win32-x86_64
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
      - name: Prepare clean main
        shell: bash
        run: git switch -C main "$GITHUB_SHA"
      - name: Install pinned dependencies and NSIS
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          pnpm install --frozen-lockfile
          choco install nsis --no-progress -y
      - name: Verify clean public export
        run: pnpm prepare:public-export -- --clean-room
      - name: Build source from the clean checkout
        run: pnpm build
      - name: Source and onboarding regression gates
        run: |
          pnpm test:unit
          pnpm test:contract
          pnpm test:security
          pnpm verify:contracts
      - name: Build exact native installer with MSVC
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          pnpm package:windows
      - name: Verify packaged Electron fuses
        env:
          PENGLAI_TARGET: win32-x86_64
        run: pnpm verify:fuses
      - name: Prove Simplified Chinese installer UI on the native host
        shell: pwsh
        run: >-
          ./scripts/windows-installer-ui-proof.ps1
          -Installer ./dist/Penglai_0.5.5_windows_x64_setup.exe
          -OutDir ./evidence/generated
      - name: Installed welcome and process smoke
        shell: pwsh
        env:
          PENGLAI_TARGET: win32-x86_64
          PENGLAI_INSTALLED_UI_HARNESS: ${{ github.workspace }}\node_modules\.pnpm\electron@43.4.0\node_modules\electron\dist\electron.exe
        run: pnpm test:u3:welcome
      - name: Installed first-party plugin compatibility
        shell: pwsh
        env:
          PENGLAI_TARGET: win32-x86_64
          PENGLAI_INSTALLED_UI_HARNESS: ${{ github.workspace }}\node_modules\.pnpm\electron@43.4.0\node_modules\electron\dist\electron.exe
        run: pnpm test:u3:plugins
      - name: Upload installer and target evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: penglai-0.5.5-win32-x86_64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/Penglai_0.5.5_windows_x64_setup.exe
            evidence/generated/local-installer-win32-x86_64.json
            evidence/generated/u3-welcome-smoke.json
            evidence/generated/u3-first-party-plugins.json
            evidence/generated/windows-installer-ui.json
            evidence/generated/windows-installer-components-zh.png
            evidence/generated/public-export.json
