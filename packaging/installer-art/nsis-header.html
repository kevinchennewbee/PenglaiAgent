<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Penglai NSIS header</title>
    <style>
      html, body { margin: 0; width: 150px; height: 57px; overflow: hidden; }
      body {
        display: flex; align-items: center; gap: 8px; padding: 0 10px;
        font-family: "Songti SC", "Microsoft YaHei UI", Georgia, serif;
        color: #f6f1e8;
        background: linear-gradient(90deg, #0b1c2c, #122433);
        border-bottom: 2px solid #c9a36a;
        box-sizing: border-box;
      }
      .seal {
        width: 28px; height: 28px; flex: none;
        display: grid; place-items: center;
        background: #c45c26; color: #fffaf4;
        border: 1px solid #c9a36a;
        font: 700 15px/1 Georgia, "Songti SC", serif;
      }
      strong { font-size: 13px; letter-spacing: 0.12em; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="seal">蓬</div>
    <strong>蓬莱</strong>
  </body>
</html>
