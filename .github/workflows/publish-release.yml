name: Publish complete release

on:
  workflow_dispatch:
    inputs:
      native_run_id:
        description: Successful native workflow run for this exact main commit
        required: true
        type: string
      release_id:
        description: Numeric ID of the mutable draft, resolved with gh release view
        required: true
        type: string
      probe_only:
        description: Only verify read access to this draft and one actual asset; never publish
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-penglai-release
  cancel-in-progress: false

jobs:
  probe:
    name: Check draft API and byte read access
    if: ${{ inputs.probe_only }}
    runs-on: macos-15
    timeout-minutes: 10
    # GitHub requires Contents write to read an unpublished draft (read gives 403).
    # This job only performs GET requests and never publishes.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
      - name: Read exact draft metadata and verify one uploaded asset
        env:
          GH_TOKEN: ${{ github.token }}
          PENGLAI_RELEASE_ID: ${{ inputs.release_id }}
        run: node scripts/probe-draft-read-access.mjs

  verify:
    name: Verify complete signed draft
    if: ${{ !inputs.probe_only }}
    runs-on: macos-15
    timeout-minutes: 30
    # Draft visibility requires Contents write; mutation is isolated in publish.
    permissions:
      contents: write
      actions: read
    outputs:
      release_id: ${{ steps.identity.outputs.release_id }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      asset_set_sha256: ${{ steps.draft.outputs.asset_set_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
      - name: Require exact main and install frozen dependencies
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          git switch -C main "$GITHUB_SHA"
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm install --frozen-lockfile
          pnpm build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: penglai-0.5.10-native-evidence-set
          run-id: ${{ inputs.native_run_id }}
          github-token: ${{ github.token }}
          path: evidence/generated
      - name: Bind native workflow, source CI and draft to the same main SHA
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          PENGLAI_NATIVE_RUN_ID: ${{ inputs.native_run_id }}
          PENGLAI_RELEASE_ID: ${{ inputs.release_id }}
        run: node --import tsx scripts/verify-publication-input.mjs
      - name: Read back all ten draft assets and verify signatures
        id: draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PENGLAI_RELEASE_ID: ${{ inputs.release_id }}
        run: pnpm readback:release-draft

  publish:
    name: Publish the verified complete draft once
    needs: verify
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Publish only the draft verified above
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.verify.outputs.release_id }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          VERIFIED_ASSET_SET: ${{ needs.verify.outputs.asset_set_sha256 }}
        run: node scripts/publish-verified-draft.mjs


  readback:
    name: Verify immutable public bytes
    needs: publish
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
      - name: Read back the published release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm install --frozen-lockfile
          pnpm build
          mkdir -p evidence/generated
          node --import tsx scripts/readback-release.mjs > evidence/generated/public-release-readback.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: penglai-0.5.10-public-readback
          path: evidence/generated/public-release-readback.json
          if-no-files-found: error
          retention-days: 90
