<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Penglai NSIS welcome</title>
    <style>
      html, body { margin: 0; width: 164px; height: 314px; overflow: hidden; }
      body {
        font-family: "Songti SC", "Microsoft YaHei UI", Georgia, serif;
        color: #f6f1e8;
        background:
          radial-gradient(ellipse at 50% 0%, rgba(201, 163, 106, 0.28), transparent 48%),
          linear-gradient(180deg, #0b1c2c, #122433);
      }
      .hairline { height: 2px; background: #c9a36a; }
      .inner { padding: 28px 16px 20px; text-align: center; }
      .seal {
        width: 48px; height: 48px; margin: 0 auto 18px;
        display: grid; place-items: center;
        background: #c45c26; color: #fffaf4;
        border: 1px solid #c9a36a;
        font: 700 26px/1 Georgia, "Songti SC", serif;
      }
      h1 { margin: 0; font-size: 18px; letter-spacing: 0.16em; font-weight: 600; }
      p { margin: 10px 0 0; font-size: 11px; color: #c9c2b6; }
    </style>
  </head>
  <body>
    <div class="hairline"></div>
    <div class="inner">
      <div class="seal">蓬</div>
      <h1>蓬莱</h1>
      <p>Penglai</p>
    </div>
  </body>
</html>
