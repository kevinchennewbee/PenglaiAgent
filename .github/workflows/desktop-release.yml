name: desktop-release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/desktop-release.yml"
      - "install.sh"
      - "install.ps1"
      - "frontends/desktop/**"
      - "frontends/*.py"
      - "penglai"
      - "penglai_im_launch.py"
      - "penglai_runtime/**"
      - "packaging/**"
      - "tests/test_penglai_runtime.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-dmg:
    name: macOS DMG release
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set PENGLAI_VERSION
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "PENGLAI_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            # 非 tag 构建时从 Cargo.toml 读版本号，避免与 Tauri 实际产物版本号不匹配
            cargo_version=$(awk -F'"' '/^version = / {print $2; exit}' frontends/desktop/src-tauri/Cargo.toml)
            if [ -z "$cargo_version" ]; then
              echo "::error::无法从 Cargo.toml 读取版本号"
              exit 1
            fi
            echo "PENGLAI_VERSION=${cargo_version}" >> "$GITHUB_ENV"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontends/desktop/package-lock.json

      - name: Setup Rust
        env:
          RUSTUP_DIST_SERVER: ${{ vars.RUSTUP_DIST_SERVER || 'https://mirrors.tuna.tsinghua.edu.cn/rustup' }}
          RUSTUP_UPDATE_ROOT: ${{ vars.RUSTUP_UPDATE_ROOT || 'https://mirrors.tuna.tsinghua.edu.cn/rustup/rustup' }}
        run: rustup toolchain install stable --profile minimal

      - name: Configure Cargo mirror
        shell: bash
        env:
          PENGLAI_CARGO_REGISTRY_INDEX: ${{ vars.PENGLAI_CARGO_REGISTRY_INDEX || 'sparse+https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/' }}
          PENGLAI_CARGO_REGISTRY_NAME: ${{ vars.PENGLAI_CARGO_REGISTRY_NAME || 'penglai-mirror' }}
        run: |
          if [ -n "$PENGLAI_CARGO_REGISTRY_INDEX" ]; then
            mkdir -p .cargo
            cat > .cargo/config.toml <<EOF
          [source.crates-io]
          replace-with = "$PENGLAI_CARGO_REGISTRY_NAME"

          [source.$PENGLAI_CARGO_REGISTRY_NAME]
          registry = "$PENGLAI_CARGO_REGISTRY_INDEX"
          EOF
          fi

      - name: Cache desktop build downloads
        uses: actions/cache@v4
        with:
          path: |
            .cache/pbs
            ~/.cache/pip
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-desktop-downloads-${{ hashFiles('frontends/desktop/package-lock.json', 'frontends/desktop/src-tauri/Cargo.lock', 'packaging/build_desktop_runtime.py') }}
          restore-keys: |
            ${{ runner.os }}-desktop-downloads-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Apple signing secrets
        if: startsWith(github.ref, 'refs/tags/v')
        id: check-apple-signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID KEYCHAIN_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::warning::Apple signing secrets not configured (%s). Building unsigned DMG.\n' "${missing[*]}"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Apple Developer ID certificate
        if: startsWith(github.ref, 'refs/tags/v') && steps.check-apple-signing.outputs.available == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f certificate.p12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
          security find-identity -v -p codesigning build.keychain |
            awk -v team="$APPLE_TEAM_ID" -F'"' '/Developer ID Application/ && index($0, "(" team ")") {print $2}' > developer-id-identities.txt
          cert_count="$(wc -l < developer-id-identities.txt | tr -d ' ')"
          if [ "$cert_count" != "1" ]; then
            echo "::error::Exactly one Developer ID Application certificate for team $APPLE_TEAM_ID is required; found $cert_count."
            cat developer-id-identities.txt
            exit 1
          fi
          cert_id="$(cat developer-id-identities.txt)"
          rm -f developer-id-identities.txt
          echo "APPLE_SIGNING_IDENTITY=$cert_id" >> "$GITHUB_ENV"

      - name: Install desktop dependencies
        working-directory: frontends/desktop
        env:
          NPM_CONFIG_REGISTRY: ${{ vars.NPM_CONFIG_REGISTRY || 'https://registry.npmmirror.com/' }}
        run: npm ci

      - name: Static checks
        run: |
          node --check frontends/desktop/static/app.js
          node --check frontends/desktop/static/penglai-web.js
          cargo check --manifest-path frontends/desktop/src-tauri/Cargo.toml

      - name: Desktop bridge contract tests
        env:
          PIP_INDEX_URL: ${{ vars.PENGLAI_PIP_INDEX || 'https://pypi.tuna.tsinghua.edu.cn/simple' }}
        run: |
          python -m pip install --disable-pip-version-check pytest aiohttp
          python -m pytest -q tests/test_penglai_runtime.py -k 'desktop_bridge or desktop_static_ui_uses_chinese_runtime_labels or desktop_package_identity_targets_penglai_release or selfcheck_exercises_runtime_contracts or install_script_targets_main_release'

      - name: Build desktop runtime payload
        shell: bash
        env:
          # Override in repository/environment variables for domestic mirrors
          # or an internal archive cache. User first launch never downloads it.
          PENGLAI_PBS_BASE_URL: ${{ vars.PENGLAI_PBS_BASE_URL || 'https://github.com/astral-sh/python-build-standalone/releases/download' }}
          PENGLAI_PBS_URL_TEMPLATE: ${{ vars.PENGLAI_PBS_URL_TEMPLATE || '' }}
          PENGLAI_PBS_CACHE: .cache/pbs
          PENGLAI_PIP_INDEX: ${{ vars.PENGLAI_PIP_INDEX || 'https://pypi.tuna.tsinghua.edu.cn/simple' }}
        run: |
          python packaging/build_desktop_runtime.py \
            --source . \
            --output frontends/desktop/src-tauri/resources/penglai-runtime \
            --with-standalone-python mac-arm64
          python packaging/verify_desktop_runtime.py \
            frontends/desktop/src-tauri/resources/penglai-runtime \
            --require-bundled-python \
            --forbid-venv

      - name: Runtime bootstrap smoke
        shell: bash
        run: |
          set -euo pipefail
          PENGLAI_DIR="$RUNNER_TEMP/PenglaiAgent-bootstrap" \
          PENGLAI_BRANCH=main \
          PENGLAI_INSTALL_DEPS=1 \
          PENGLAI_INSTALL_VERIFY=1 \
          PENGLAI_SKIP_SETUP=1 \
          sh install.sh

      - name: Build signed DMG
        if: startsWith(github.ref, 'refs/tags/v') && steps.check-apple-signing.outputs.available == 'true'
        working-directory: frontends/desktop
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 无密码，因为生成密钥时未设密码
        run: npm run build:mac

      - name: Build DMG (unsigned)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') || steps.check-apple-signing.outputs.available != 'true' }}
        working-directory: frontends/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 无密码，因为生成密钥时未设密码
        run: npm run build:mac

      - name: Re-sign app with adhoc signature and repack DMG
        if: ${{ !startsWith(github.ref, 'refs/tags/v') || steps.check-apple-signing.outputs.available != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          dmg="frontends/desktop/src-tauri/target/release/bundle/dmg/Penglai_${PENGLAI_VERSION}_aarch64.dmg"
          test -f "$dmg"
          work_dir="$(mktemp -d /tmp/penglai-repack.XXXXXX)"
          mount_dir="$(mktemp -d /tmp/penglai-dmg-mount.XXXXXX)"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg"
          ditto "$mount_dir/" "$work_dir/"
          hdiutil detach "$mount_dir" || true
          # Tauri leaves a linker-signed app (Sealed Resources=none) that macOS
          # reports as "damaged". Re-sign with a proper adhoc signature so the
          # bundle resources are sealed and Gatekeeper shows the normal
          # "unidentified developer" prompt instead of "damaged".
          codesign --force --deep --sign - "$work_dir/Penglai.app"
          codesign --verify --deep --strict "$work_dir/Penglai.app"
          rm -f "$dmg"
          hdiutil create -volname "Penglai" -srcfolder "$work_dir" -ov -format UDZO "$dmg"
          rm -rf "$work_dir"

      - name: Regenerate updater artifacts after adhoc re-sign
        if: ${{ !startsWith(github.ref, 'refs/tags/v') || steps.check-apple-signing.outputs.available != 'true' }}
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          bundle_dir="$GITHUB_WORKSPACE/frontends/desktop/src-tauri/target/release/bundle"
          dmg_dir="$bundle_dir/dmg"
          macos_dir="$bundle_dir/macos"
          dmg="$dmg_dir/Penglai_${PENGLAI_VERSION}_aarch64.dmg"
          test -f "$dmg"

          # Remove stale updater artifacts emitted before the adhoc re-sign.
          # The Stage step selects the tarball via `find ... | head -n1`, so
          # any leftover pre-re-sign .tar.gz/.sig would ship a "damaged"
          # (linker-signed) update to tauri-plugin-updater clients.
          find "$bundle_dir" -type f -name 'Penglai*.tar.gz' -print -delete
          find "$bundle_dir" -type f -name 'Penglai*.tar.gz.sig' -print -delete

          # Extract the adhoc-signed .app from the repacked DMG.
          work_dir="$(mktemp -d /tmp/penglai-updater.XXXXXX)"
          mount_dir="$(mktemp -d /tmp/penglai-mount.XXXXXX)"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg"
          ditto "$mount_dir/Penglai.app" "$work_dir/Penglai.app"
          hdiutil detach "$mount_dir" || true

          # Regenerate the updater tarball from the adhoc-signed .app. Tauri
          # v2 with createUpdaterArtifacts=true ships .app.tar.gz on macOS
          # (a tarball of the .app bundle, not of the .dmg), so we mirror
          # that format and the Penglai_${PENGLAI_VERSION}_aarch64.* prefix so the Stage
          # step's glob still matches and latest.json stays consistent.
          tar -czf "$macos_dir/Penglai_${PENGLAI_VERSION}_aarch64.app.tar.gz" -C "$work_dir" Penglai.app

          # Re-sign the new tarball with the tauri updater private key. The
          # key was generated without a password, so --password "" matches
          # the empty TAURI_SIGNING_PRIVATE_KEY_PASSWORD used at build time.
          # stdin is redirected from /dev/null to never block on a prompt.
          cd "$GITHUB_WORKSPACE/frontends/desktop"
          npx --no-install tauri signer sign \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --password "" \
            "$macos_dir/Penglai_${PENGLAI_VERSION}_aarch64.app.tar.gz" < /dev/null

          test -f "$macos_dir/Penglai_${PENGLAI_VERSION}_aarch64.app.tar.gz.sig"
          rm -rf "$work_dir"
          echo "Regenerated Penglai_${PENGLAI_VERSION}_aarch64.app.tar.gz + .sig after adhoc re-sign"

      - name: Verify DMG
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_AVAILABLE: ${{ steps.check-apple-signing.outputs.available || 'false' }}
        run: |
          set -euo pipefail
          dmg="frontends/desktop/src-tauri/target/release/bundle/dmg/Penglai_${PENGLAI_VERSION}_aarch64.dmg"
          test -f "$dmg"
          hdiutil imageinfo "$dmg" | tee /tmp/penglai-dmg-imageinfo.txt
          mount_dir="$(mktemp -d /tmp/penglai-dmg.XXXXXX)"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg"
          trap 'hdiutil detach "$mount_dir" || true' EXIT
          test -d "$mount_dir/Penglai.app"
          test -L "$mount_dir/Applications"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$mount_dir/Penglai.app/Contents/Info.plist" | grep -Fx com.penglai.agent
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$mount_dir/Penglai.app/Contents/Info.plist" | grep -Fx "${PENGLAI_VERSION}"
          runtime_payload="$mount_dir/Penglai.app/Contents/Resources/penglai-runtime"
          if [ ! -f "$runtime_payload/manifest.json" ]; then
            runtime_payload="$mount_dir/Penglai.app/Contents/Resources/resources/penglai-runtime"
          fi
          test -f "$runtime_payload/manifest.json"
          python packaging/verify_desktop_runtime.py "$runtime_payload" --require-bundled-python --forbid-venv
          "$mount_dir/Penglai.app/Contents/MacOS/penglai-desktop" --runtime-payload-selfcheck
          install_selfcheck_dir="$(mktemp -d /tmp/penglai-runtime-install.XXXXXX)"
          "$mount_dir/Penglai.app/Contents/MacOS/penglai-desktop" --runtime-install-selfcheck "$install_selfcheck_dir/runtime" | tee "$install_selfcheck_dir/result.json"
          test -f "$install_selfcheck_dir/runtime/frontends/desktop_bridge.py"
          python - "$install_selfcheck_dir/result.json" "$install_selfcheck_dir/runtime" <<'PY'
          import json, os, sys
          result_path, runtime_dir = sys.argv[1:3]
          data = json.load(open(result_path, encoding="utf-8"))
          python_path = os.path.realpath(data["python_path"])
          runtime_dir = os.path.realpath(runtime_dir)
          payload_dir = os.path.realpath(data["runtime_dir"])
          if data.get("python_kind") not in {"standalone", "embedded"}:
              raise SystemExit(f"runtime install selfcheck used non-portable Python kind: {data.get('python_kind')}")
          if data.get("python_scope") == "runtime":
              expected_root = payload_dir
          elif data.get("python_scope") == "source":
              expected_root = runtime_dir
          else:
              raise SystemExit(f"runtime install selfcheck reported unknown Python scope: {data.get('python_scope')}")
          if not python_path.startswith(expected_root + os.sep):
              raise SystemExit(f"runtime install selfcheck used external Python: {python_path}")
          if not data.get("bridge"):
              raise SystemExit("runtime install selfcheck did not report desktop bridge")
          PY
          codesign --verify --deep --strict --verbose=4 "$mount_dir/Penglai.app"
          sign_info="$(codesign -dv --verbose=4 "$mount_dir/Penglai.app" 2>&1)"
          printf '%s\n' "$sign_info"
          ! grep -F "code has no resources" <<<"$sign_info"
          if [ "$APPLE_SIGNING_AVAILABLE" != "true" ]; then
            echo "Unsigned build: verified DMG layout and adhoc signature structure (no 'damaged' error)."
            exit 0
          fi
          grep -F "Authority=Developer ID Application" <<<"$sign_info"
          grep -F "TeamIdentifier=$APPLE_TEAM_ID" <<<"$sign_info"
          grep -F "(runtime)" <<<"$sign_info"
          ! grep -F "Signature=adhoc" <<<"$sign_info"
          ! grep -F "TeamIdentifier=not set" <<<"$sign_info"
          xcrun stapler validate "$mount_dir/Penglai.app"
          spctl -a -vvv -t exec "$mount_dir/Penglai.app"
          xcrun stapler validate "$dmg"
          spctl -a -vvv -t open --context context:primary-signature "$dmg"
          "$mount_dir/Penglai.app/Contents/MacOS/penglai-desktop" &
          app_pid="$!"
          sleep 5
          if ! kill -0 "$app_pid" 2>/dev/null; then
            wait "$app_pid"
            exit 1
          fi
          kill "$app_pid" || true
          copied_app_dir="$(mktemp -d /tmp/penglai-installed-app.XXXXXX)"
          ditto "$mount_dir/Penglai.app" "$copied_app_dir/Penglai.app"
          xattr -w com.apple.quarantine "0083;$(printf '%x' "$(date +%s)");GitHubActions;PenglaiDesktop" "$copied_app_dir/Penglai.app"
          codesign --verify --deep --strict --verbose=4 "$copied_app_dir/Penglai.app"
          spctl -a -vvv -t exec "$copied_app_dir/Penglai.app"
          "$copied_app_dir/Penglai.app/Contents/MacOS/penglai-desktop" &
          copied_app_pid="$!"
          sleep 5
          if ! kill -0 "$copied_app_pid" 2>/dev/null; then
            wait "$copied_app_pid"
            exit 1
          fi
          kill "$copied_app_pid" || true
          rm -rf "$copied_app_dir"

      - name: Cleanup Apple signing keychain
        if: always() && steps.check-apple-signing.outputs.available == 'true'
        shell: bash
        run: |
          rm -f certificate.p12 developer-id-identities.txt
          security delete-keychain build.keychain >/dev/null 2>&1 || true

      - name: Stage macOS artifact
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp frontends/desktop/src-tauri/target/release/bundle/dmg/Penglai_${PENGLAI_VERSION}_aarch64.dmg \
            dist/Penglai_${PENGLAI_VERSION}_macos_aarch64.dmg
          # Copy updater artifacts (.tar.gz + .sig) for tauri-plugin-updater.
          # Tauri v2 with createUpdaterArtifacts=true may emit .dmg.tar.gz or
          # .app.tar.gz depending on version; pick whichever exists and
          # normalize the name to match the latest.json URL.
          updater_tarball="$(find frontends/desktop/src-tauri/target/release/bundle \
            -type f -name "Penglai_${PENGLAI_VERSION}_aarch64.*.tar.gz" 2>/dev/null | head -n1 || true)"
          if [ -n "$updater_tarball" ] && [ -f "$updater_tarball" ]; then
            cp "$updater_tarball" dist/Penglai_${PENGLAI_VERSION}_macos_aarch64.dmg.tar.gz
            if [ -f "${updater_tarball}.sig" ]; then
              cp "${updater_tarball}.sig" dist/Penglai_${PENGLAI_VERSION}_macos_aarch64.dmg.tar.gz.sig
            fi
          fi
          ls -la dist/

      - name: Upload macOS artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: penglai-${{ env.PENGLAI_VERSION }}-macos-aarch64
          path: |
            dist/*.dmg
            dist/*.tar.gz
            dist/*.sig
          if-no-files-found: error

  windows-nsis:
    name: Windows NSIS release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set PENGLAI_VERSION
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "PENGLAI_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            # 非 tag 构建时从 Cargo.toml 读版本号，避免与 Tauri 实际产物版本号不匹配
            cargo_version=$(awk -F'"' '/^version = / {print $2; exit}' frontends/desktop/src-tauri/Cargo.toml)
            if [ -z "$cargo_version" ]; then
              echo "::error::无法从 Cargo.toml 读取版本号"
              exit 1
            fi
            echo "PENGLAI_VERSION=${cargo_version}" >> "$GITHUB_ENV"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontends/desktop/package-lock.json

      - name: Setup Rust
        shell: pwsh
        env:
          RUSTUP_DIST_SERVER: ${{ vars.RUSTUP_DIST_SERVER || 'https://mirrors.tuna.tsinghua.edu.cn/rustup' }}
          RUSTUP_UPDATE_ROOT: ${{ vars.RUSTUP_UPDATE_ROOT || 'https://mirrors.tuna.tsinghua.edu.cn/rustup/rustup' }}
        run: rustup toolchain install stable --profile minimal

      - name: Configure Cargo mirror
        shell: pwsh
        env:
          PENGLAI_CARGO_REGISTRY_INDEX: ${{ vars.PENGLAI_CARGO_REGISTRY_INDEX || 'sparse+https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/' }}
          PENGLAI_CARGO_REGISTRY_NAME: ${{ vars.PENGLAI_CARGO_REGISTRY_NAME || 'penglai-mirror' }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not [string]::IsNullOrWhiteSpace($env:PENGLAI_CARGO_REGISTRY_INDEX)) {
            New-Item -ItemType Directory -Force -Path ".cargo" | Out-Null
            @"
          [source.crates-io]
          replace-with = "$env:PENGLAI_CARGO_REGISTRY_NAME"

          [source.$env:PENGLAI_CARGO_REGISTRY_NAME]
          registry = "$env:PENGLAI_CARGO_REGISTRY_INDEX"
          "@ | Set-Content -Path ".cargo/config.toml" -Encoding UTF8
          }

      - name: Cache desktop build downloads
        uses: actions/cache@v4
        with:
          path: |
            .cache\pbs
            ~\.cargo\registry
            ~\.cargo\git
            ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-desktop-downloads-${{ hashFiles('frontends/desktop/package-lock.json', 'frontends/desktop/src-tauri/Cargo.lock', 'packaging/build_desktop_runtime.py') }}
          restore-keys: |
            ${{ runner.os }}-desktop-downloads-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Windows signing secrets
        if: startsWith(github.ref, 'refs/tags/v')
        id: check-windows-signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $missing = @()
          foreach ($name in @("WINDOWS_CERTIFICATE", "WINDOWS_CERTIFICATE_PASSWORD")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              $missing += $name
            }
          }
          if ($missing.Count -gt 0) {
            Write-Warning "Windows code-signing secrets not configured ($($missing -join ', ')). Building unsigned installer."
            "available=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "available=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Import Windows signing certificate
        if: startsWith(github.ref, 'refs/tags/v') && steps.check-windows-signing.outputs.available == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path certificate | Out-Null
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item -Path certificate/tempCert.txt -Force
          $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          if (-not $cert -or [string]::IsNullOrWhiteSpace($cert.Thumbprint)) {
            throw "Windows code-signing certificate import did not produce a thumbprint."
          }
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $configPath = "frontends/desktop/src-tauri/tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json -Depth 100
          $config.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue $cert.Thumbprint -Force
          $config | ConvertTo-Json -Depth 100 | Set-Content -Path $configPath -Encoding UTF8

      - name: Install desktop dependencies
        working-directory: frontends/desktop
        env:
          NPM_CONFIG_REGISTRY: ${{ vars.NPM_CONFIG_REGISTRY || 'https://registry.npmmirror.com/' }}
        run: npm ci

      - name: Static checks
        shell: pwsh
        run: |
          node --check frontends/desktop/static/app.js
          node --check frontends/desktop/static/penglai-web.js
          $null = [scriptblock]::Create((Get-Content install.ps1 -Raw))
          cargo check --manifest-path frontends/desktop/src-tauri/Cargo.toml

      - name: Desktop bridge contract tests
        shell: pwsh
        env:
          PIP_INDEX_URL: ${{ vars.PENGLAI_PIP_INDEX || 'https://pypi.tuna.tsinghua.edu.cn/simple' }}
        run: |
          python -m pip install --disable-pip-version-check pytest requests beautifulsoup4 bottle aiohttp lark-oapi qrcode pillow pyyaml
          python -m pytest -q tests/test_penglai_runtime.py -k 'desktop_bridge or desktop_static_ui_uses_chinese_runtime_labels or desktop_package_identity_targets_penglai_release or selfcheck_exercises_runtime_contracts or install_script_targets_main_release'

      - name: Build desktop runtime payload
        shell: pwsh
        env:
          # Override in repository/environment variables for domestic mirrors
          # or an internal archive cache. User first launch never downloads it.
          PENGLAI_PBS_BASE_URL: ${{ vars.PENGLAI_PBS_BASE_URL || 'https://github.com/astral-sh/python-build-standalone/releases/download' }}
          PENGLAI_PBS_URL_TEMPLATE: ${{ vars.PENGLAI_PBS_URL_TEMPLATE || '' }}
          PENGLAI_PBS_CACHE: .cache/pbs
          PENGLAI_PIP_INDEX: ${{ vars.PENGLAI_PIP_INDEX || 'https://pypi.tuna.tsinghua.edu.cn/simple' }}
        run: |
          python packaging/build_desktop_runtime.py `
            --source . `
            --output frontends/desktop/src-tauri/resources/penglai-runtime `
            --with-standalone-python win-x64
          python packaging/verify_desktop_runtime.py `
            frontends/desktop/src-tauri/resources/penglai-runtime `
            --require-bundled-python `
            --forbid-venv

      - name: Runtime bootstrap smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PENGLAI_DIR = Join-Path $env:RUNNER_TEMP "PenglaiAgent-bootstrap"
          $env:PENGLAI_BRANCH = "main"
          $env:PENGLAI_INSTALL_VERIFY = "1"
          .\install.ps1

      - name: Build NSIS installer
        working-directory: frontends/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 无密码，因为生成密钥时未设密码
        run: npm run build:windows

      - name: Verify silent install and uninstall
        shell: pwsh
        env:
          WINDOWS_SIGNING_AVAILABLE: ${{ steps.check-windows-signing.outputs.available || 'false' }}
        run: |
          $ErrorActionPreference = "Stop"
          function Split-CommandLine([string]$CommandLine) {
            if (-not $CommandLine) { return @("", "") }
            if ($CommandLine -match '^\s*"([^"]+)"\s*(.*)$') {
              return @($Matches[1], $Matches[2].Trim())
            }
            $parts = $CommandLine -split '\s+', 2
            $args = if ($parts.Count -gt 1) { $parts[1].Trim() } else { "" }
            return @($parts[0], $args)
          }

          function Get-ExecutablePath([string]$Value) {
            if (-not $Value) { return "" }
            $parts = Split-CommandLine $Value
            $candidate = [string]$parts[0]
            $candidate = $candidate.Trim('"')
            $candidate = $candidate -replace ',\d+$', ''
            return $candidate
          }

          $setup = Get-ChildItem "frontends/desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $setup) { throw "NSIS setup exe not found" }
          if ($env:WINDOWS_SIGNING_AVAILABLE -eq "true") {
            $setupSig = Get-AuthenticodeSignature $setup.FullName
            if ($setupSig.Status -ne "Valid") {
              throw "NSIS setup is not Authenticode signed and valid. Status=$($setupSig.Status) Path=$($setup.FullName)"
            }
            if ($setupSig.SignerCertificate.Thumbprint -ne $env:WINDOWS_CERTIFICATE_THUMBPRINT) {
              throw "NSIS setup was signed by unexpected certificate. Actual=$($setupSig.SignerCertificate.Thumbprint) Expected=$env:WINDOWS_CERTIFICATE_THUMBPRINT"
            }
          }
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          $artifactName = "Penglai_$($env:PENGLAI_VERSION)_windows_x64_setup.exe"
          Copy-Item $setup.FullName (Join-Path "dist" $artifactName) -Force
          # Copy updater signature (.sig) for tauri-plugin-updater.
          # Tauri v2 emits <name>-setup.exe.sig next to the installer when
          # createUpdaterArtifacts=true and TAURI_SIGNING_PRIVATE_KEY is set.
          $setupSigPath = "$($setup.FullName).sig"
          if (Test-Path $setupSigPath) {
            Copy-Item $setupSigPath (Join-Path "dist" "$artifactName.sig") -Force
          }

          $install = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS silent install failed with exit code $($install.ExitCode)" }

          $roots = @(
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )
          $deadline = (Get-Date).AddSeconds(30)
          $app = $null
          do {
            $app = Get-ItemProperty $roots -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -like "Penglai*" } |
              Select-Object -First 1
            if ($app) { break }
            Start-Sleep -Seconds 2
          } until ((Get-Date) -gt $deadline)
          if (-not $app) { throw "Installed Penglai uninstall entry not found" }

          $installLocation = [string]$app.InstallLocation
          $displayIconExe = Get-ExecutablePath ([string]$app.DisplayIcon)
          if ((-not $installLocation -or -not (Test-Path $installLocation)) -and $displayIconExe -and (Test-Path $displayIconExe)) {
            $installLocation = Split-Path -Parent $displayIconExe
          }
          if (-not $installLocation -or -not (Test-Path $installLocation)) {
            throw "Installed Penglai location not found. InstallLocation='$($app.InstallLocation)' DisplayIcon='$($app.DisplayIcon)'"
          }

          $installedExe = $null
          if ($displayIconExe -and (Test-Path $displayIconExe) -and $displayIconExe -notmatch "unins|uninstall") {
            $installedExe = Get-Item $displayIconExe
          }
          if (-not $installedExe) {
            $installedExe = Get-ChildItem $installLocation -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notmatch "unins|uninstall" } |
            Select-Object -First 1
          }
          if (-not $installedExe) { throw "Installed Penglai app exe not found" }
          if ($env:WINDOWS_SIGNING_AVAILABLE -eq "true") {
            $installedSig = Get-AuthenticodeSignature $installedExe.FullName
            if ($installedSig.Status -ne "Valid") {
              throw "Installed Penglai exe is not Authenticode signed and valid. Status=$($installedSig.Status) Path=$($installedExe.FullName)"
            }
            if ($installedSig.SignerCertificate.Thumbprint -ne $env:WINDOWS_CERTIFICATE_THUMBPRINT) {
              throw "Installed Penglai exe was signed by unexpected certificate. Actual=$($installedSig.SignerCertificate.Thumbprint) Expected=$env:WINDOWS_CERTIFICATE_THUMBPRINT"
            }
          }
          $runtimeManifest = Get-ChildItem $installLocation -Recurse -Filter "manifest.json" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like "*penglai-runtime*" } |
            Select-Object -First 1
          if (-not $runtimeManifest) { throw "Installed Penglai runtime payload manifest not found under $installLocation" }
          $runtimePayload = Split-Path -Parent $runtimeManifest.FullName
          python packaging/verify_desktop_runtime.py $runtimePayload --require-bundled-python --forbid-venv
          $payloadCheck = Start-Process -FilePath $installedExe.FullName -ArgumentList "--runtime-payload-selfcheck" -Wait -PassThru -NoNewWindow
          if ($payloadCheck.ExitCode -ne 0) { throw "Installed Penglai runtime payload selfcheck failed with exit code $($payloadCheck.ExitCode)" }
          $installSelfcheckDir = Join-Path $env:RUNNER_TEMP "penglai-runtime-install-selfcheck"
          Remove-Item -LiteralPath $installSelfcheckDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $installSelfcheckDir | Out-Null
          $installCheckTarget = Join-Path $installSelfcheckDir "runtime"
          $installCheckOut = Join-Path $installSelfcheckDir "result.json"
          $installPayloadCheck = Start-Process -FilePath $installedExe.FullName -ArgumentList @("--runtime-install-selfcheck", $installCheckTarget) -Wait -PassThru -NoNewWindow -RedirectStandardOutput $installCheckOut
          if ($installPayloadCheck.ExitCode -ne 0) { throw "Installed Penglai runtime install selfcheck failed with exit code $($installPayloadCheck.ExitCode)" }
          if (-not (Test-Path (Join-Path $installCheckTarget "frontends\desktop_bridge.py"))) { throw "Runtime install selfcheck did not unpack desktop_bridge.py" }
          $installCheckJson = Get-Content $installCheckOut -Raw | ConvertFrom-Json
          $selectedPython = [IO.Path]::GetFullPath([string]$installCheckJson.python_path)
          if (@("standalone", "embedded") -notcontains [string]$installCheckJson.python_kind) {
            throw "Runtime install selfcheck used non-portable Python kind: $($installCheckJson.python_kind)"
          }
          if ([string]$installCheckJson.python_scope -eq "runtime") {
            $expectedRuntimeRoot = [IO.Path]::GetFullPath([string]$installCheckJson.runtime_dir)
          } elseif ([string]$installCheckJson.python_scope -eq "source") {
            $expectedRuntimeRoot = [IO.Path]::GetFullPath($installCheckTarget)
          } else {
            throw "Runtime install selfcheck reported unknown Python scope: $($installCheckJson.python_scope)"
          }
          if (-not $selectedPython.StartsWith($expectedRuntimeRoot, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Runtime install selfcheck used external Python: $selectedPython"
          }
          if (-not $installCheckJson.bridge) { throw "Runtime install selfcheck did not report desktop bridge" }

          $pythonPath = (Get-Command python).Source
          $projectDir = (Resolve-Path ".").Path
          $settingsPath = Join-Path $HOME ".penglai_desktop_settings.json"
          @{ python_path = $pythonPath; project_dir = $projectDir } | ConvertTo-Json | Set-Content -Path $settingsPath -Encoding UTF8
          $smokeToken = "penglai-ci-bridge-smoke-$([Guid]::NewGuid().ToString('N'))"
          $launched = Start-Process -FilePath $installedExe.FullName -PassThru -Environment @{PENGLAI_NO_TRAY="1"; PENGLAI_DESKTOP_BRIDGE_TOKEN=$smokeToken}
          try {
            $origin = "http://127.0.0.1:14168"
            $bridgeReady = $false
            $deadline = (Get-Date).AddSeconds(60)
            do {
              if ($launched.HasExited) {
                throw "Installed Penglai app exited during bridge smoke test with code $($launched.ExitCode)"
              }
              try {
                $index = Invoke-WebRequest -UseBasicParsing -Uri "$origin/" -TimeoutSec 3
                if ($index.Content -match 'window\.__PENGLAI_BRIDGE_TOKEN__') {
                  throw "Installed Penglai app exposed the desktop bridge token in index HTML."
                }
                if ($index.StatusCode -eq 200 -and $index.Content -match 'window\.__PENGLAI_BOOTSTRAP__') {
                  $bridgeReady = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 2
              }
            } until ((Get-Date) -gt $deadline)
            if (-not $bridgeReady) {
              throw "Installed Penglai app did not expose a ready desktop bridge index on $origin."
            }
            $headers = @{ "X-Penglai-Bridge-Token" = $smokeToken; "Origin" = $origin }
            $statusDoc = Invoke-RestMethod -Uri "$origin/status" -Headers $headers -TimeoutSec 10
            if (-not $statusDoc.ok -or -not $statusDoc.ready) { throw "Desktop bridge /status is not ready." }
            $opsDoc = Invoke-RestMethod -Uri "$origin/ops/checks" -Headers $headers -TimeoutSec 30
            if (-not (@($opsDoc.commands.read_only) -contains "install-check")) { throw "Desktop bridge ops catalog does not expose install-check." }
            $runtimeDoc = Invoke-RestMethod -Uri "$origin/runtime/status" -Headers $headers -TimeoutSec 30
            if (-not $runtimeDoc.ok -or -not $runtimeDoc.session.session_id) { throw "Desktop bridge runtime status is not available." }
            $runsDoc = Invoke-RestMethod -Uri "$origin/runtime/runs?limit=5" -Headers $headers -TimeoutSec 30
            if ($null -eq $runsDoc.runs) { throw "Desktop bridge runtime runs response is missing runs." }
            $installCheckDoc = Invoke-RestMethod -Uri "$origin/ops/command?name=install-check" -Headers $headers -TimeoutSec 120
            if (-not $installCheckDoc.ok) { throw "Desktop bridge install-check failed. Output=$($installCheckDoc.stdout) Error=$($installCheckDoc.stderr)" }
          } finally {
            if (-not $launched.HasExited) {
              [void]$launched.CloseMainWindow()
              Start-Sleep -Seconds 3
            }
            if (-not $launched.HasExited) {
              Stop-Process -Id $launched.Id -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 2
            }
            # Kill any remaining bridge process on port 14168
            $bridgePid = (Get-NetTCPConnection -LocalPort 14168 -ErrorAction SilentlyContinue | Select-Object -First 1).OwningProcess
            if ($bridgePid) { Stop-Process -Id $bridgePid -Force -ErrorAction SilentlyContinue }
          }

          $uninstallString = if ($app.QuietUninstallString) { [string]$app.QuietUninstallString } else { [string]$app.UninstallString }
          if (-not $uninstallString) { throw "Penglai uninstall command missing" }
          $uninstallParts = Split-CommandLine $uninstallString
          $uninstallExe = [string]$uninstallParts[0]
          $uninstallArgs = [string]$uninstallParts[1]
          if (-not (Test-Path $uninstallExe)) { throw "Penglai uninstall executable missing: $uninstallExe" }
          if ($uninstallArgs -notmatch '(^|\s)/S(\s|$)') {
            $uninstallArgs = if ($uninstallArgs) { "$uninstallArgs /S" } else { "/S" }
          }
          $uninstall = Start-Process -FilePath $uninstallExe -ArgumentList $uninstallArgs -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "NSIS silent uninstall failed with exit code $($uninstall.ExitCode)" }
          $deadline = (Get-Date).AddSeconds(30)
          do {
            if (-not (Test-Path $installedExe.FullName)) { break }
            Start-Sleep -Seconds 2
          } until ((Get-Date) -gt $deadline)
          if (Test-Path $installedExe.FullName) { throw "Installed Penglai exe remains after uninstall: $($installedExe.FullName)" }
          $remainingApps = Get-ItemProperty $roots -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like "Penglai*" } |
            Select-Object -First 1
          if ($remainingApps) { throw "Penglai uninstall registry entry remains: $($remainingApps.DisplayName)" }
          $portOpen = Get-NetTCPConnection -LocalPort 14168 -State Listen -ErrorAction SilentlyContinue
          if ($portOpen) { throw "Desktop bridge port 14168 is still listening after uninstall smoke cleanup." }

      - name: Upload Windows artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: penglai-${{ env.PENGLAI_VERSION }}-windows-x64
          path: |
            dist/*.exe
            dist/*.sig
          if-no-files-found: error

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - macos-dmg
      - windows-nsis
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Set PENGLAI_VERSION
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "PENGLAI_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            # 非 tag 构建时从 Cargo.toml 读版本号，避免与 Tauri 实际产物版本号不匹配
            cargo_version=$(awk -F'"' '/^version = / {print $2; exit}' frontends/desktop/src-tauri/Cargo.toml)
            if [ -z "$cargo_version" ]; then
              echo "::error::无法从 Cargo.toml 读取版本号"
              exit 1
            fi
            echo "PENGLAI_VERSION=${cargo_version}" >> "$GITHUB_ENV"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          PenglaiAgent ${PENGLAI_VERSION} — self-hosted AI butler with Runtime Hub and desktop clients.

          ## What's new in ${PENGLAI_VERSION}

          - **Runtime Hub**: Unified execution layer for all channels (Feishu, WeChat, terminal, desktop). FIFO queuing, task auditing, session persistence.
          - **Desktop clients**: Native Mac (Apple Silicon) and Windows (x64) apps with complete setup wizard, multi-session chat, system tray, update detection, channel/ability management.
          - **Complete setup wizard**: Language → LLM selection (12 providers with live connectivity test) → IM channel setup (Feishu QR scan, WeChat, etc.) → Identity naming → Capability panel (voice/TTS/companion/critic/intel) → Config writing and launch verification.
          - **Voice & TTS**: Local SenseVoice transcription (emotion + acoustic events) and MOSS-TTS-Nano speech synthesis, both CPU-only.
          - **Update mechanism**: `penglai update --check` and one-click `--apply` with automatic backup and rollback.
          - **Memory system**: 4-layer architecture (L1 index → L2 facts → L3 SOPs → L4 session logs), action-verified only.
          - **补配置 (supplementary config)**: Channel and ability management panel in desktop settings — re-enable channels or abilities post-install without re-running the full wizard.
          - **Doctor diagnostics**: Full system health check integrated into both CLI and desktop.

          ## Install

          ### Desktop (recommended for new users)
          - **macOS**: Download the DMG, drag to Applications. On first open, go to System Settings → Privacy & Security → Open Anyway.
          - **Windows**: Download the installer, run it. SmartScreen → More Info → Run Anyway.
          - Desktop installers include the Penglai runtime, standalone Python, and core dependencies. First launch does not require users to install Python, clone source code, or download Python packages.

          ### Command line
          ```bash
          curl -fsSL https://raw.githubusercontent.com/kevinchennewbee/PenglaiAgent/main/install.sh | sh
          ```

          ## Important notes
          - macOS and Windows installers are **not code-signed by Apple/Microsoft** (community project without Developer Program membership). Gatekeeper/SmartScreen will still block first launch — bypass as noted above. The Tauri app itself, however, is signed via `tauri-plugin-updater` (separate signing key), so in-app auto-updates are verified and install cleanly. Apple Developer ID signing/notarization and the updater signing key are two independent mechanisms; only the latter is configured today.
          - Apple Silicon only for macOS. Intel Mac not supported.
          - Upgrade from 0.2.x is not guaranteed stable; fresh install recommended.
          - Feishu is the most validated IM channel. Other channels are experimental.
          - Docker is no longer supported since 0.3.0. There is no Dockerfile, docker-compose, docker-install, GHCR image, or container deployment path.
          EOF
          sed -i 's/\${PENGLAI_VERSION}/'"${PENGLAI_VERSION}"'/g' release-notes.md

      - name: Generate latest.json for tauri-plugin-updater
        shell: bash
        env:
          PENGLAI_UPDATER_BASE_URL: ${{ vars.PENGLAI_UPDATER_BASE_URL || '' }}
        run: |
          set -euo pipefail
          VERSION="${PENGLAI_VERSION}"
          NOTES="PenglaiAgent ${PENGLAI_VERSION} release notes"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          DEFAULT_BASE_URL="https://gh-proxy.com/https://github.com/kevinchennewbee/PenglaiAgent/releases/download/v${VERSION}"
          BASE_URL="${PENGLAI_UPDATER_BASE_URL:-$DEFAULT_BASE_URL}"
          BASE_URL="${BASE_URL%/}"

          # Build platforms object. Each entry requires the .sig (signature)
          # and the bundle it signs to both be present in dist/.
          platforms=""

          add_platform() {
            local key="$1" sig_file="$2" url="$3"
            if [ -f "$sig_file" ]; then
              local sig_val url_val
              sig_val="$(jq -Rs . < "$sig_file")"
              url_val="$(printf '%s' "$url" | jq -Rs .)"
              if [ -n "$platforms" ]; then platforms="${platforms},"; fi
              platforms="${platforms}\"${key}\":{\"signature\":${sig_val},\"url\":${url_val}}"
            else
              echo "::warning::Missing updater signature: $sig_file"
            fi
          }

          # macOS aarch64 (updater artifact is .dmg.tar.gz + .sig)
          add_platform "darwin-aarch64" \
            "dist/Penglai_${PENGLAI_VERSION}_macos_aarch64.dmg.tar.gz.sig" \
            "${BASE_URL}/Penglai_${PENGLAI_VERSION}_macos_aarch64.dmg.tar.gz"

          # Windows x86_64 (NSIS -setup.exe + .sig)
          add_platform "windows-x86_64" \
            "dist/Penglai_${PENGLAI_VERSION}_windows_x64_setup.exe.sig" \
            "${BASE_URL}/Penglai_${PENGLAI_VERSION}_windows_x64_setup.exe"

          if [ -z "$platforms" ]; then
            echo "::error::No updater .sig files found in dist/. Cannot generate latest.json."
            ls -la dist/
            exit 1
          fi

          jq -n \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg pub_date "$PUB_DATE" \
            --argjson platforms "{${platforms}}" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' \
            > dist/latest.json

          echo "Generated dist/latest.json:"
          cat dist/latest.json

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          RELEASE_TITLE="PenglaiAgent ${PENGLAI_VERSION}"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md
