name: Source CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: source-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Full source gates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
      - name: Install pinned dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          pnpm install --frozen-lockfile
      - name: Source, contract, and evidence-class gates
        run: |
          pnpm format:check
          pnpm typecheck
          pnpm test:unit
          pnpm test:contract
          pnpm test:integration
          pnpm test:e2e
          pnpm test:security
          pnpm test:chaos
          pnpm test:failure-baseline
          pnpm audit:secrets
          pnpm audit:dependencies
          pnpm audit:licenses
          pnpm verify:versions
          pnpm verify:identity
          pnpm verify:contracts
          pnpm verify:dependencies
          pnpm build
          pnpm pack:plugins
          pnpm verify:clean-clone
